[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xu-brain"
version = "0.1.0"
description = "Xu agent brain — sidecar daemon: agent loop, tools, memory, skills, plugins"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "websockets>=12",
    "httpx>=0.27",
    "pydantic>=2",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
# The built-in `debug` tool shells a DAP server over stdio; without this the
# tool reports "debugpy not installed" rather than failing hard.
debug = ["debugpy>=1.8"]
[project.scripts]
xu-brain = "xu_brain.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["xu_brain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
